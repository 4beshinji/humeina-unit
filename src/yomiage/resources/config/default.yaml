tts:
  primary_provider: voicevox
  fallback_provider: null
  lookahead_chunks: 5
  max_chunk_chars: 200

voisona:
  url: ${VOISONA_URL:-http://localhost:32766}
  username: ${VOISONA_USERNAME}
  password: ${VOISONA_PASSWORD}
  default_voice: nurse-robot-type-t_ja_JP
  language: ja_JP

voicevox:
  url: ${VOICEVOX_URL:-http://localhost:50021}
  default_speaker: 47

voicepeak:
  path: null
  default_narrator: "Otomachi Una"
  max_chars: 140
  pitch_scale: 300

llm:
  providers:
    local:
      type: llama_cpp
      base_url: ${LLAMA_CPP_URL:-http://127.0.0.1:8080/v1}
      api_key: ${LLAMA_CPP_API_KEY:-}
      model: ${LLAMA_CPP_MODEL:-Qwen3.8-27B}
      protocol: chat_completions
      context_tokens: 32768
      timeout_seconds: 600
      min_output_tokens: 512
      enabled: false
    opencode_go:
      type: opencode_go
      base_url: https://opencode.ai/zen/go/v1
      api_key: ${OPENCODE_GO_API_KEY:-}
      model: ${OPENCODE_GO_MODEL:-qwen3.8-flash}
      protocol: auto
      context_tokens: 131072
      min_output_tokens: 2048
      enabled: true
  routes:
    default: {provider: opencode_go, max_output_tokens: 16384}
    scene_analysis: {provider: opencode_go, max_output_tokens: 16384}
    character_analysis: {provider: opencode_go, max_output_tokens: 16384}
    romanization: {provider: opencode_go, max_output_tokens: 8192}
    news_summary: {provider: opencode_go, max_output_tokens: 16384}
    urgency_scoring: {provider: opencode_go, max_output_tokens: 4096}
    slack_scoring: {provider: opencode_go, max_output_tokens: 4096}
    ex_voice: {provider: opencode_go, max_output_tokens: 8192}
  fallback:
    order: [opencode_go]
    "on": [unavailable, timeout, rate_limit]
  limits:
    context_safety_ratio: 0.80
    availability_ttl_seconds: 60
    max_retries: 2
    max_requests_per_job: 100
    max_input_tokens_per_job: 500000
    on_budget_exceeded: rule_based

news:
  daily_schedule: "08:00"
  poll_interval_minutes: 5
  urgency_threshold: 0.8
  foreign_language: translate
  sources:
    - nhk_main
    - bbc_world
    - guardian_world
  tts:
    speed: 1.1

slack:
  enabled: false
  channels: []
  mention_boost: 0.5
  importance_threshold: 0.6

reader:
  auto_advance: true
  bookmark_auto_save: true

video:
  enabled: false
  resolution: [1920, 1080]
  fps: 24
  codec: libx264
  crf: 23
  preset: medium
  subtitle:
    font_size: 48
    font_name: "Noto Sans JP"
    outline_size: 3
    margin_bottom: 60
    max_chars_per_line: 20
    speaker_colors:
      _narrator: "#FFFFFF"
      _dialogue: "#FFFF00"
      _thought: "#87CEEB"
  background:
    transition: fade
    transition_duration: 1.0
    ken_burns_enabled: false
    ken_burns_zoom: 1.2
    scene_colors:
      daily: "#2C3E50"
      battle: "#8B0000"
      romance: "#FF69B4"
      tense: "#1C1C1C"
      comedy: "#FFD700"
      sad: "#4A4A8A"
      horror: "#0D0D0D"
  portrait:
    enabled: true
    position: bottom_right
    max_height_ratio: 0.7
    fade_duration: 0.3
    margin_x: 50
    margin_y: 20
  audio:
    bgm_enabled: false
    bgm_volume: 0.15
    bgm_idle_volume: 0.3
    se_enabled: false
    se_volume: 0.5
    ducking_fade: 0.5
  title_card:
    enabled: false
    duration: 3.0
    font_size: 72
    subtitle_font_size: 36
  assets_dir: assets

ex_voice:
  enabled: false
  wav_dir: ${EX_VOICE_WAV_DIR:-}
  cooldown_chunks: 10
  max_per_chapter: 8
  llm_max_insertions: 2

studio:
  default_format: ymm4
  default_pause: 0.3
  max_slug_chars: 15
  default_provider: voicevox
  cache_enabled: true

batch:
  output_dir: output
  default_mode: voicevox
  analysis_window_chars: 3000
  analysis_window_sentences: 25
  analysis_strategy: single_pass
  manifest_save_interval: 10
  silence_duration: 1.5
  concat_format: wav
  cleanup_after_concat: false
  voisona_vm_mount: ${VOISONA_VM_MOUNT:-Z:}
  voice_profile_dir: ${YOMIAGE_USER_CONFIG_DIR:-~/.config/humeina-unit}/voice_profiles
  voicevox_profile_dir: ${YOMIAGE_USER_CONFIG_DIR:-~/.config/humeina-unit}/voicevox_profiles
  voicepeak_profile_dir: ${YOMIAGE_USER_CONFIG_DIR:-~/.config/humeina-unit}/voicepeak_profiles
  # VoiSona側の同時処理ジョブ数上限（流量制御）
  # 1=同時接続1本のみ（VoiSona推奨）、増やすと並列合成で高速になるがキューが増える
  synth_concurrency: 1
