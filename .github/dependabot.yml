version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: monthly
