name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run external-service E2E tests"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tests:
    name: pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run unit and integration tests
        run: uv run python -m pytest -q -m "not e2e and not packaging"

  core-only:
    name: core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install core dependencies only
        run: uv sync --no-dev
      - name: Import and render CLI help without extras
        run: |
          uv run --no-sync python -c "import yomiage, yomiage.server"
          uv run --no-sync yomiage --help
          uv run --no-sync yomiage serve --help
      - name: Missing extra exits with guidance
        run: |
          set +e
          uv run --no-sync yomiage news daily 2> news.err
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "humeina-unit\[news\]" news.err

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Ruff
        run: uv run python -m ruff check src/ tests/

  packaging:
    name: packaging smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --extra dev
      - name: Build wheel
        run: uv build --wheel
      - name: Create isolated wheel environment
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/yomiage-wheel-smoke"
          uv pip install \
            --python "${RUNNER_TEMP}/yomiage-wheel-smoke/bin/python" \
            dist/*.whl
      - name: Run installed-wheel smoke tests
        env:
          YOMIAGE_SMOKE_PYTHON: ${{ runner.temp }}/yomiage-wheel-smoke/bin/python
        run: uv run python -m pytest -q tests/smoke -m packaging

  e2e:
    name: pytest (e2e)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run explicitly marked external-service tests
        run: uv run python -m pytest -q -m e2e
