<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Humeina Unit Reader 設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Humeina Unit Reader 設定</h1>
      <p>ローカルで起動している <code>yomiage serve</code> への接続を設定します。</p>

      <form id="settings">
        <label for="server-url">サーバーURL</label>
        <input id="server-url" name="serverUrl" type="url" required placeholder="http://127.0.0.1:8030">
        <p class="help">安全のため、localhostまたは127.0.0.1だけを利用できます。</p>

        <label for="api-token">API token</label>
        <input id="api-token" name="apiToken" type="password" autocomplete="off">
        <p class="help">サーバーにtokenを設定している場合だけ入力します。Firefox Syncには保存しません。</p>

        <label for="provider">既定の音声エンジン</label>
        <select id="provider" name="provider">
          <option value="auto">自動（設定された優先順）</option>
          <option value="voisona">VoiSona</option>
          <option value="voicevox">VOICEVOX</option>
        </select>

        <label for="extraction-mode">ツールバーボタンの本文取得方法</label>
        <select id="extraction-mode" name="extractionMode">
          <option value="smart">選択範囲を優先し、なければページ本文</option>
          <option value="article">常にページ本文を抽出</option>
          <option value="url">URLをサーバー側で取得</option>
        </select>

        <div class="actions">
          <button type="submit">保存</button>
          <button id="test" type="button">接続テスト</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
